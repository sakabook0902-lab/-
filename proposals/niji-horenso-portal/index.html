<title>ニジ看護転職 報連相ポータル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: left sidebar (collapses to drawer on phones) + main area with toolbar, member filter chips and a time grid with one column per member */
:root{
  --bg:#f4f6f6; --surface:#ffffff; --line:#e1e7e7; --line-strong:#cfd8d8; --fg:#1d2a2c; --muted:#617578;
  --accent:#0f8b8d; --accent-soft:#dff1f1; --on-accent:#ffffff; --now:#e8735a;
  --warn:#b7791f; --warn-soft:#fbf1dc; --ok:#2f8f4e; --ok-soft:#e5f4ea;
  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --hour:46px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101718; --surface:#172123; --line:#243234; --line-strong:#2f4043; --fg:#e4eeee; --muted:#93a8aa;
  --accent:#3bb8b9; --accent-soft:#163a3b; --on-accent:#0c1617; --now:#f08d77;
  --warn:#e0a849; --warn-soft:#352a14; --ok:#5cc27c; --ok-soft:#173023; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101718; --surface:#172123; --line:#243234; --line-strong:#2f4043; --fg:#e4eeee; --muted:#93a8aa;
  --accent:#3bb8b9; --accent-soft:#163a3b; --on-accent:#0c1617; --now:#f08d77;
  --warn:#e0a849; --warn-soft:#352a14; --ok:#5cc27c; --ok-soft:#173023; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;height:100%;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
/* sidebar */
aside{display:flex;flex-direction:column;gap:4px;padding:16px 12px;border-right:1px solid var(--line);background:var(--bg);min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-family:var(--f-display);font-weight:700;font-size:16px}
.brand svg{width:30px;height:17px;flex:none}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;color:var(--muted)}
.navlink{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:999px;color:var(--fg);text-decoration:none;font-weight:700}
.navlink svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}
.navlink[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.navlink:hover{background:var(--line)}
.sep{border-top:1px solid var(--line);margin:10px 14px}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:12px 10px;border-top:1px solid var(--line)}
.me small{display:block;color:var(--muted);font-size:12px}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px max(16px,env(safe-area-inset-right,0px)) 10px 20px}
.icon-btn{width:36px;height:36px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--fg)}
.icon-btn:hover{background:var(--line)}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.date-title{font-family:var(--f-display);font-size:22px;font-weight:700;margin:0 6px;white-space:nowrap}
.spacer{flex:1}
.pillbtn{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.primary{border:0;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:9px 18px;font-weight:700;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.ghost{border:1px solid var(--line-strong);background:transparent;border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:700}
.danger{color:#c2413a;border-color:#c2413a}
.filters{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding:0 max(16px,env(safe-area-inset-right,0px)) 12px 20px}
.filters select{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:6px 12px}
.chip{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-weight:500;white-space:nowrap}
.chip input{appearance:none;width:18px;height:18px;border-radius:4px;border:2px solid var(--c);margin:0;cursor:pointer;display:grid;place-items:center}
.chip input:checked{background:var(--c)}
.chip input:checked::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.vsep{width:1px;height:24px;background:var(--line-strong)}
/* views */
.view{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 max(16px,env(safe-area-inset-right,0px)) 16px 20px}
.cal{flex:1;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:auto;position:relative}
.grid{display:grid;grid-template-columns:64px repeat(var(--cols),minmax(150px,1fr));min-width:max-content}
.grid.week{grid-template-columns:64px repeat(7,minmax(120px,1fr))}
.head{position:sticky;top:0;z-index:4;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 12px;display:flex;gap:10px;align-items:center;min-width:0;border-left:1px solid var(--line)}
.head.corner{border-left:0;left:0;z-index:5}
.head b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head small{color:var(--muted);font-size:12px}
.head.today b{color:var(--accent)}
.dnum{font-family:var(--f-mono);font-size:20px}
.allday{border-left:1px solid var(--line);border-bottom:1px solid var(--line-strong);padding:4px;display:flex;flex-direction:column;gap:3px;min-height:34px;background:var(--surface);position:sticky;top:57px;z-index:3}
.allday.label{border-left:0;font-size:11px;color:var(--muted);text-align:right;padding-right:8px;left:0;z-index:4}
.adev{border-radius:5px;padding:2px 8px;color:#fff;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border:0;text-align:left}
.times{position:sticky;left:0;z-index:2;background:var(--surface)}
.times div{height:var(--hour);font-size:11px;color:var(--muted);text-align:right;padding-right:8px;transform:translateY(-8px);font-family:var(--f-mono)}
.col{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--hour))}
.col.off{background-color:var(--bg)}
.ev{position:absolute;border-radius:6px;padding:3px 7px;color:#fff;font-size:12px;line-height:1.35;overflow:hidden;cursor:pointer;border:1px solid var(--surface);text-align:left}
.ev b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev span{font-family:var(--f-mono);font-size:11px;opacity:.92}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--now);z-index:1;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--now)}
/* month */
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(104px,1fr);min-height:100%}
.mh{font-size:12px;color:var(--muted);text-align:center;padding:6px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.mc{border-left:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;display:flex;flex-direction:column;gap:2px;min-width:0;cursor:pointer}
.mc:nth-child(7n+1){border-left:0}
.mc.other{background:var(--bg)}
.mc .n{font-family:var(--f-mono);font-size:12px;align-self:center;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.mc.today .n{background:var(--accent);color:var(--on-accent)}
.mchip{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:4px;align-items:center}
.mchip i{width:8px;height:8px;border-radius:50%;flex:none}
.more{font-size:11px;color:var(--muted);padding-left:4px}
/* page views */
.page{flex:1;overflow:auto;padding-bottom:24px}
.page h1{font-family:var(--f-display);font-size:20px;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.panel h2{font-family:var(--f-display);font-size:15px;margin:0 0 10px}
.rep{border-top:1px solid var(--line);padding:12px 0;display:flex;gap:10px}
.rep:first-of-type{border-top:0;padding-top:0}
.nums{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.num{font-size:11px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.num b{font-family:var(--f-mono)}
.muted{color:var(--muted);font-size:12px}
.tablebox{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:13px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted)}
.tag{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap}
.t-a{background:#fbe7e5;color:#a8352f}.t-b{background:var(--warn-soft);color:var(--warn)}.t-c{background:var(--ok-soft);color:var(--ok)}
.member{display:flex;gap:10px;align-items:center;padding:8px 0}
form.f{display:grid;gap:10px}
label.l{display:grid;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line-strong);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%}
.f textarea{min-height:70px;resize:vertical}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
/* dialog */
dialog{border:0;border-radius:16px;padding:0;width:min(480px,calc(100% - 32px));background:var(--surface);color:var(--fg);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,20,22,.45)}
.dlg{padding:20px;display:grid;gap:12px}
.dlg h2{font-family:var(--f-display);margin:0;font-size:18px}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.detail dt{font-size:12px;color:var(--muted)}.detail dd{margin:0 0 8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:8px;font-weight:700;z-index:30}
.sample{font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:6px 10px;margin:10px 4px 0}
.menu-btn{display:none}
.scrim{display:none}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;inset:0 auto 0 0;width:260px;z-index:40;background:var(--surface);transform:translateX(-100%);transition:transform .2s;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-left:max(12px,env(safe-area-inset-left,0px))}
  .app.open aside{transform:none}
  .app.open .scrim{display:block;position:fixed;inset:0;background:rgba(10,20,22,.4);z-index:35}
  .menu-btn{display:grid}
  .toolbar,.filters,.view{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .date-title{font-size:18px}
  .hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" id="app">
  <div class="scrim" id="scrim"></div>
  <aside aria-label="メニュー">
    <div class="brand">
      <svg viewBox="0 0 30 17" aria-hidden="true"><path d="M2 16a13 13 0 0 1 26 0" fill="none" stroke="#e8735a" stroke-width="2.6"/><path d="M6 16a9 9 0 0 1 18 0" fill="none" stroke="#e0a849" stroke-width="2.6"/><path d="M10 16a5 5 0 0 1 10 0" fill="none" stroke="#0f8b8d" stroke-width="2.6"/></svg>
      <div>ニジポータル<small>ニジ看護転職</small></div>
    </div>
    <a class="navlink" href="#calendar"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>カレンダー</a>
    <a class="navlink" href="#daily"><svg viewBox="0 0 24 24"><path d="M5 7h10M5 12h8M5 17h5M14 19l6-6-2-2-6 6v2z"/></svg>日報</a>
    <a class="navlink" href="#clients"><svg viewBox="0 0 24 24"><path d="M4 20V8l8-4 8 4v12M9 20v-5h6v5M12 8v4M10 10h4"/></svg>医療機関</a>
    <div class="sep"></div>
    <a class="navlink" href="#members"><svg viewBox="0 0 24 24"><circle cx="9" cy="9" r="3"/><circle cx="17" cy="10" r="2.4"/><path d="M3.5 19c.8-3 3-4.5 5.5-4.5s4.7 1.5 5.5 4.5M15 15.2c2.3-.3 4.4.9 5.3 3.8"/></svg>部署とメンバー</a>
    <div class="sample">提案用デモです。人名・医療機関・予定はすべてサンプルです。</div>
    <div class="me"><span class="av" id="meAv"></span><div><b id="meName"></b><small>キャリアアドバイザー部</small></div></div>

  <div class="main">
    <!-- CALENDAR -->
    <section class="view" data-view="calendar">
      <div class="toolbar" style="padding-left:0;padding-right:0">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="メニューを開く"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>

          <button data-mode="day" aria-pressed="true">日</button><button data-mode="week" aria-pressed="false">週</button><button data-mode="month" aria-pressed="false">月</button>

      </div>
      <div class="cal" id="cal"></div>

    <!-- DAILY -->
    <section class="view" data-view="daily" hidden>
      <div class="toolbar" style="padding-left:0"><button class="icon-btn menu-btn" aria-label="メニューを開く" data-menu><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></div>
      <div class="page">

        <p class="lead">その日の数字と振り返りを提出。チームの日報はここで全員が見られます。</p>

                <label class="l" for="d3">書類推薦<input type="number" id="d3" min="0" value="4"></label>

          </div>
        </div>
      </div>
    </section>

    <!-- CLIENTS -->
    <section class="view" data-view="clients" hidden>
      <div class="toolbar" style="padding-left:0"><button class="icon-btn menu-btn" aria-label="メニューを開く" data-menu><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></div>
      <div class="page">

    <!-- MEMBERS -->
    <section class="view" data-view="members" hidden>
      <div class="toolbar" style="padding-left:0"><button class="icon-btn menu-btn" aria-label="メニューを開く" data-menu><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></div>
      <div class="page">
        <h1>部署とメンバー</h1>
        <p class="lead">名前を押すと、その人だけのカレンダーを表示します。</p>
        <div class="cards" id="memberCards"></div>
      </div>

</div>

const pad=n=>String(n).padStart(2,"0");

function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let s=seed||1;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return((s>>>0)%10000)/10000}}

let userEv=[];try{userEv=JSON.parse(localStorage.getItem("niji-ev"))||[]}catch(e){}
const saveEv=()=>{try{localStorage.setItem("niji-ev",JSON.stringify(userEv))}catch(e){}};
const cache={};
function genFor(dk){
  if(cache[dk])return cache[dk];
  const d=new Date(dk+"T00:00:00");const wd=d.getDay();const out=[];
  if(wd>0&&wd<6){
    M.forEach(m=>out.push({id:`g-${dk}-${m.id}-am`,m:m.id,type:"朝会",title:"全体朝会（オンライン）",date:dk,s:9*60,e:9*60+20,gen:1}));
  }
  M.forEach(m=>{
    const r=rng(hash(dk+m.id));
    if(wd===0)return;
    if(wd===6){ if(m.d===0&&r()<.3){out.push({id:`g-${dk}-${m.id}-sat`,m:m.id,type:"面談",title:"求職者 初回面談（土曜枠）",date:dk,s:10*60,e:11*60,gen:1})}return}
    if(r()<.12){const a=ALLDAY[Math.floor(r()*ALLDAY.length)];out.push({id:`g-${dk}-${m.id}-ad`,m:m.id,type:a[0],title:a[1],date:dk,all:1,gen:1});if(a[0]==="休")return}
    const n=1+Math.floor(r()*3.2);const slots=[10,11,13,14,15,16,17];const used=new Set();
    for(let i=0;i<n;i++){
      let h;do{h=slots[Math.floor(r()*slots.length)]}while(used.has(h)&&used.size<slots.length);
      if(used.has(h))break;const tp=T[m.d][Math.floor(r()*T[m.d].length)];
      const dur=tp[2];if(used.has(h+1)&&dur>60)continue;used.add(h);if(dur>60)used.add(h+1);
      const no=1000+Math.floor(r()*80);
      out.push({id:`g-${dk}-${m.id}-${i}`,m:m.id,type:tp[0],title:tp[1].replace("{h}",HOSP[Math.floor(r()*HOSP.length)]),date:dk,s:h*60,e:h*60+dur,gen:1,who:m.d===0&&/面談|同行|フォロー/.test(tp[0])?`C-${no}`:""});
    }
  });
  return cache[dk]=out;
}

// ----- lane layout
function lanes(list){
  list.sort((a,b)=>a.s-b.s||b.e-a.e);let group=[],end=-1;const out=[];
  const flush=()=>{const cols=[];group.forEach(ev=>{let i=cols.findIndex(c=>c<=ev.s);if(i<0){i=cols.length;cols.push(0)}cols[i]=ev.e;ev._l=i});group.forEach(ev=>ev._n=cols.length);out.push(...group);group=[]};
  list.forEach(ev=>{if(ev.s>=end&&group.length)flush();group.push(ev);end=Math.max(end,ev.e)});if(group.length)flush();return out;
}
const START=7,END=22;
function evBlock(ev,label){
  const m=byId[ev.m];const top=(ev.s/60-START)*46,h=Math.max(20,(ev.e-ev.s)/60*46-2);
  const w=100/ev._n;
  return `<button class="ev" data-ev="${ev.id}" style="top:${top}px;height:${h}px;left:calc(${ev._l*w}% + 2px);width:calc(${w}% - 4px);background:${m.c}"><b>${label?esc(m.n.split(" ")[0])+"｜":""}【${esc(ev.type)}】${esc(ev.title)}</b><span>${hm(ev.s)}–${hm(ev.e)}</span></button>`;
}
function timesCol(){let h="";for(let i=START;i<END;i++)h+=`<div>${i===START?"":i+":00"}</div>`;return `<div class="times">${h}</div>`}
function nowLine(dk){if(dk!==key(new Date()))return"";const n=new Date();const mins=n.getHours()*60+n.getMinutes();if(mins<START*60||mins>END*60)return"";return `<div class="nowline" style="top:${(mins/60-START)*46}px"></div>`}

function render(){

  const d=state.date;const title=document.getElementById("dateTitle");
  if(state.mode==="day"){title.textContent=`${d.getMonth()+1}月${d.getDate()}日（${WD[d.getDay()]}）`;dayView()}
  else if(state.mode==="week"){const s=addD(d,-((d.getDay()+6)%7)),e=addD(s,6);title.textContent=`${s.getMonth()+1}月${s.getDate()}日 – ${e.getMonth()===s.getMonth()?"":e.getMonth()+1+"月"}${e.getDate()}日`;weekView(s)}
  else{title.textContent=`${d.getFullYear()}年${d.getMonth()+1}月`;monthView()}
}
function emptyMsg(){cal.innerHTML=`<div style="padding:40px;text-align:center;color:var(--muted)">表示する人が選ばれていません。上のチェックで選ぶと予定が並びます。</div>`}
function dayView(){
  const vs=visible();if(!vs.length)return emptyMsg();
  const dk=key(state.date);const evs=eventsOn(dk);const off=[0,6].includes(state.date.getDay());
  let head=`<div class="head corner"></div>`,ad=`<div class="allday label">終日</div>`,cols="";
  vs.forEach(m=>{
    const mine=evs.filter(e=>e.m===m.id);const timed=mine.filter(e=>!e.all);
    head+=`<div class="head">${av(m)}<div style="min-width:0"><b>${esc(m.n)}</b><small>${mine.length}件</small></div></div>`;
    ad+=`<div class="allday">${mine.filter(e=>e.all).map(e=>`<button class="adev" data-ev="${e.id}" style="background:${m.c}">【${esc(e.type)}】${esc(e.title)}</button>`).join("")}</div>`;
    cols+=`<div class="col${off?" off":""}" data-m="${m.id}" style="height:${(END-START)*46}px">${lanes(timed).map(e=>evBlock(e)).join("")}${nowLine(dk)}</div>`;
  });
  cal.innerHTML=`<div class="grid" style="--cols:${vs.length}">${head}${ad}${timesCol()}${cols}</div>`;
  scrollToWork();
}
function weekView(s){
  const vs=visible();if(!vs.length)return emptyMsg();const ids=new Set(vs.map(m=>m.id));
  let head=`<div class="head corner"></div>`,ad=`<div class="allday label">終日</div>`,cols="";
  for(let i=0;i<7;i++){
    const day=addD(s,i),dk=key(day);let evs=eventsOn(dk).filter(e=>ids.has(e.m));
    if(vs.length>1)evs=evs.filter(e=>e.type!=="朝会").concat(evs.some(e=>e.type==="朝会")?[{...evs.find(e=>e.type==="朝会"),m:ME,id:"am-"+dk,title:"全体朝会（全員）"}]:[]);
    const isT=dk===key(today);
    head+=`<div class="head${isT?" today":""}" style="cursor:pointer" data-goto="${dk}"><div><small>${WD[day.getDay()]}</small><b class="dnum">${day.getDate()}</b></div><small>${evs.length}件</small></div>`;
    const alls=evs.filter(e=>e.all);
    ad+=`<div class="allday">${alls.slice(0,2).map(e=>`<button class="adev" data-ev="${e.id}" style="background:${byId[e.m].c}">${esc(byId[e.m].n.split(" ")[0])}｜${esc(e.type)}</button>`).join("")}${alls.length>2?`<span class="more">他${alls.length-2}件</span>`:""}</div>`;
    cols+=`<div class="col${[0,6].includes(day.getDay())?" off":""}" style="height:${(END-START)*46}px">${lanes(evs.filter(e=>!e.all).map(e=>({...e}))).map(e=>evBlock(e,vs.length>1)).join("")}${nowLine(dk)}</div>`;
  }
  cal.innerHTML=`<div class="grid week">${head}${ad}${timesCol()}${cols}</div>`;
  scrollToWork();
}
function monthView(){
  const vs=visible();if(!vs.length)return emptyMsg();const ids=new Set(vs.map(m=>m.id));
  const first=new Date(state.date.getFullYear(),state.date.getMonth(),1);const s=addD(first,-((first.getDay()+6)%7));
  let h="月火水木金土日".split("").map(w=>`<div class="mh">${w}</div>`).join("");
  for(let i=0;i<42;i++){
    const day=addD(s,i),dk=key(day);const evs=eventsOn(dk).filter(e=>ids.has(e.m)&&e.type!=="朝会").sort((a,b)=>(a.all?-1:a.s)-(b.all?-1:b.s));
    h+=`<div class="mc${day.getMonth()!==first.getMonth()?" other":""}${dk===key(today)?" today":""}" data-goto="${dk}" tabindex="0" role="button" aria-label="${day.getMonth()+1}月${day.getDate()}日 ${evs.length}件"><span class="n">${day.getDate()}</span>${evs.slice(0,3).map(e=>`<div class="mchip"><i style="background:${byId[e.m].c}"></i>${e.all?"":hm(e.s)+" "}${esc(byId[e.m].n.split(" ")[0])} ${esc(e.type)}</div>`).join("")}${evs.length>3?`<span class="more">他${evs.length-3}件</span>`:""}</div>`;
  }
  cal.innerHTML=`<div class="month">${h}</div>`;cal.scrollTop=0;
}

// ----- clients & members
document.getElementById("clientBody").innerHTML=CLIENTS.map(([h,t,a,n,p,ra,dd])=>{const d=addD(today,dd);return `<tr><td><b>${HOSP[h]}</b></td><td>${t}</td><td>${a}</td><td>${n}件</td><td><span class="tag t-${p.toLowerCase()}">${p}</span></td><td>${byId[ra].n}</td><td>${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）</td></tr>`}).join("");
document.getElementById("memberCards").innerHTML=DEPTS.map((dn,i)=>`<div class="panel"><h2>${dn}<span class="muted">　${M.filter(m=>m.d===i).length}人</span></h2>${M.filter(m=>m.d===i).map(m=>`<div class="member">${av(m)}<a href="#calendar" data-only="${m.id}" style="color:var(--fg);font-weight:700">${m.n}</a>${m.lead?`<span class="tag t-c">リーダー</span>`:""}${m.id===ME?`<span class="muted">あなた</span>`:""}</div>`).join("")}</div>`).join("");
document.getElementById("memberCards").addEventListener("click",e=>{const a=e.target.closest("[data-only]");if(!a)return;state.sel=new Set([a.dataset.only]);state.dept=-1;state.self=false;deptSel.value=-1;syncSelf();renderChips();saveUI()});
// ----- routing & menu
const app=document.getElementById("app");
document.querySelectorAll("#menuBtn,[data-menu]").forEach(b=>b.onclick=()=>app.classList.add("open"));
document.getElementById("scrim").onclick=()=>app.classList.remove("open");
function route(){const v=["calendar","daily","clients","members"].includes(location.hash.slice(1))?location.hash.slice(1):"calendar";
  document.querySelectorAll("[data-view]").forEach(s=>s.hidden=s.dataset.view!==v);
  document.querySelectorAll(".navlink").forEach(a=>a.getAttribute("href")==="#"+v?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
  app.classList.remove("open");if(v==="calendar")render()}
addEventListener("hashchange",route);
document.getElementById("meAv").textContent=byId[ME].n[0];document.getElementById("meAv").style.background=byId[ME].c;document.getElementById("meName").textContent=byId[ME].n;
renderChips();renderReports();route();
</script>
